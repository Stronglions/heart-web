<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💕</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #000;
    overflow: hidden;
    touch-action: none;
    width: 100vw;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100dvh;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
//  Constants
// ============================================================
const W = 900;
const H = 680;
const CX = W / 2;
const CY = H / 2;
const SCALE = 14;
const COLOR = "#FF99CC";
const GRAVITY = 0.08;
const SPRING_K = 0.025;
const DAMPING = 0.94;
const EXPLOSION_FORCE = 20;

// ============================================================
//  Canvas setup
// ============================================================
const canvas = document.getElementById("c");
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext("2d");

// ============================================================
//  Heart math
// ============================================================
function heartPos(t, s) {
  s = s === undefined ? SCALE : s;
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  return { x: Math.round(x * s + CX), y: Math.round(y * s + CY) };
}

function scatterInside(x, y, beta) {
  return {
    x: x + beta * Math.log(Math.random()) * (CX - x),
    y: y + beta * Math.log(Math.random()) * (CY - y)
  };
}

function beatCurve(t) {
  return (2 * Math.sin(4 * t)) / Math.PI;
}

function calcTarget(bx, by, ratio, rox, roy) {
  const dx = bx - CX;
  const dy = by - CY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1) return { x: bx + rox, y: by + roy };
  const force = 1 / Math.pow(dist, 1.04);
  return {
    x: bx - ratio * force * dx + rox,
    y: by - ratio * force * dy + roy
  };
}

// ============================================================
//  Generate particles
// ============================================================
const particles = [];

function build() {
  const raw = [];
  const seen = new Set();
  for (let i = 0; i < 2500; i++) {
    const t = Math.random() * 2 * Math.PI;
    const p = heartPos(t);
    const k = p.x + "," + p.y;
    if (!seen.has(k)) { seen.add(k); raw.push(p); }
  }

  // raw outline
  for (const p of raw) {
    particles.push({ bx: p.x, by: p.y, sz: 1 + ((Math.random() * 3) | 0) });
    // edge diffusion (3 per raw point)
    for (let j = 0; j < 3; j++) {
      const s = scatterInside(p.x, p.y, 0.05);
      particles.push({ bx: s.x, by: s.y, sz: 1 + ((Math.random() * 2) | 0) });
    }
  }
  // center diffusion
  for (let i = 0; i < 4500; i++) {
    const p = raw[(Math.random() * raw.length) | 0];
    const s = scatterInside(p.x, p.y, 0.17);
    particles.push({ bx: s.x, by: s.y, sz: 1 + ((Math.random() * 2) | 0) });
  }

  // init physics state & pre-generate random offsets
  for (const p of particles) {
    p.x = p.bx;
    p.y = p.by;
    p.vx = 0;
    p.vy = 0;
    p.rox = (Math.random() - 0.5) * 2;
    p.roy = (Math.random() - 0.5) * 2;
    // each particle has a slight phase delay so they don't all snap at once
    p.phase = Math.random() * 100;
  }
}

build();
console.log("particles:", particles.length);

// ============================================================
//  Input
// ============================================================
let isDown = false;
let mx = CX;
let my = CY;

function getCanvasXY(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((clientX - rect.left) / rect.width) * W,
    y: ((clientY - rect.top) / rect.height) * H
  };
}

// Mouse
canvas.addEventListener("mousedown", (e) => {
  isDown = true;
  const p = getCanvasXY(e.clientX, e.clientY);
  mx = p.x; my = p.y;
});
canvas.addEventListener("mouseup", () => { isDown = false; });
canvas.addEventListener("mouseleave", () => { isDown = false; });

// Touch
canvas.addEventListener(
  "touchstart",
  (e) => {
    e.preventDefault();
    isDown = true;
    const t = e.touches[0];
    const p = getCanvasXY(t.clientX, t.clientY);
    mx = p.x; my = p.y;
  },
  { passive: false }
);
canvas.addEventListener(
  "touchend",
  (e) => {
    e.preventDefault();
    isDown = false;
  },
  { passive: false }
);
canvas.addEventListener("touchcancel", () => { isDown = false; });

// ============================================================
//  Physics & render loop
// ============================================================
let time = 0;
let frameCount = 0;

function tick() {
  time += 0.016;
  frameCount++;
  const ratio = 10 * beatCurve(time);

  // --- physics ---
  for (const p of particles) {
    if (isDown) {
      // explosion: burst outward from click point
      const edx = p.x - mx;
      const edy = p.y - my;
      const eDist = Math.sqrt(edx * edx + edy * edy) || 1;
      const f = EXPLOSION_FORCE / (1 + eDist * 0.008);
      p.vx += (edx / eDist) * f + (Math.random() - 0.5) * 2;
      p.vy += (edy / eDist) * f + (Math.random() - 0.5) * 2;
    } else {
      // spring toward heart target
      const tgt = calcTarget(p.bx, p.by, ratio, p.rox, p.roy);
      p.vx += (tgt.x - p.x) * SPRING_K;
      p.vy += (tgt.y - p.y) * SPRING_K;
      // gravity
      p.vy += GRAVITY;
    }

    // damping
    p.vx *= DAMPING;
    p.vy *= DAMPING;

    // integrate
    p.x += p.vx;
    p.y += p.vy;

    // wrap around when too far off screen
    if (p.y > H + 100) {
      p.y = -((Math.random() * 200) | 0);
      p.x = Math.random() * W;
      p.vx *= 0.3;
      p.vy *= 0.3;
    }
    if (p.x < -150) p.x = -150;
    if (p.x > W + 150) p.x = W + 150;
  }

  // --- render ---
  ctx.clearRect(0, 0, W, H);

  for (const p of particles) {
    ctx.fillStyle = COLOR;
    ctx.fillRect(p.x | 0, p.y | 0, p.sz, p.sz);
  }

  // text
  ctx.fillStyle = COLOR;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = 'bold 38px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.globalAlpha = 0.95;
  ctx.fillText("我的公主殿下", CX, CY);
  ctx.globalAlpha = 1;

  requestAnimationFrame(tick);
}

tick();
</script>
</body>
</html>
