<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    overflow: hidden;
    touch-action: none;
  }
  #heartCanvas {
    display: block;
    width: min(100vw, 100vh * 4/3);
    height: min(100vh, 100vw * 3/4);
  }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
const CANVAS_WIDTH = 640;
const CANVAS_HEIGHT = 480;
const CANVAS_CENTER_X = CANVAS_WIDTH / 2;
const CANVAS_CENTER_Y = CANVAS_HEIGHT / 2;
const IMAGE_ENLARGE = 11;
const HEART_COLOR = "#FF99CC";

// ---- math helpers ----

function heartFn(t, shrinkRatio = IMAGE_ENLARGE) {
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  x = x * shrinkRatio + CANVAS_CENTER_X;
  y = y * shrinkRatio + CANVAS_CENTER_Y;
  return { x: Math.round(x), y: Math.round(y) };
}

function scatterInside(x, y, beta = 0.15) {
  const ratioX = -beta * Math.log(Math.random());
  const ratioY = -beta * Math.log(Math.random());
  return {
    x: x - ratioX * (x - CANVAS_CENTER_X),
    y: y - ratioY * (y - CANVAS_CENTER_Y)
  };
}

function shrink(x, y, ratio) {
  const dx = CANVAS_CENTER_X - x;
  const dy = CANVAS_CENTER_Y - y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const force = -1 / Math.pow(dist, 1.2);
  const fx = ratio * force * dx + (Math.random() - 0.5) * 2;
  const fy = ratio * force * dy + (Math.random() - 0.5) * 2;
  return { x: x + fx, y: y + fy };
}

function curve(p) {
  return (4 * Math.sin(4 * p)) / (2 * Math.PI);
}

function calcPosition(x, y, ratio) {
  const dx = CANVAS_CENTER_X - x;
  const dy = CANVAS_CENTER_Y - y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const force = 1 / Math.pow(dist, 1.04);
  const fx = ratio * force * dx + (Math.random() * 2 - 1);
  const fy = ratio * force * dy + (Math.random() * 2 - 1);
  return { x: x - fx, y: y - fy };
}

// ---- Heart "class" ----

let _points = [];                     // {x,y}
let _edgeDiffusionPoints = [];        // {x,y}
let _centerDiffusionPoints = [];      // {x,y}
let allPoints = {};                   // frame -> [{x,y,size}]
const GENERATE_FRAME = 20;

function build(number) {
  const seen = new Set();
  for (let i = 0; i < number; i++) {
    const t = Math.random() * 2 * Math.PI;
    const p = heartFn(t);
    const key = p.x + ',' + p.y;
    if (!seen.has(key)) {
      seen.add(key);
      _points.push(p);
    }
  }
  for (const p of _points) {
    for (let i = 0; i < 3; i++) {
      _edgeDiffusionPoints.push(scatterInside(p.x, p.y, 0.05));
    }
  }
  for (let i = 0; i < 4000; i++) {
    const p = _points[Math.floor(Math.random() * _points.length)];
    _centerDiffusionPoints.push(scatterInside(p.x, p.y, 0.17));
  }
}

function calc(frame) {
  const ratio = 10 * curve(frame / 10 * Math.PI);
  const haloRadius = 4 + 6 * (1 + curve(frame / 10 * Math.PI));
  const haloNumber = 3000 + 4000 * Math.abs(Math.pow(curve(frame / 10 * Math.PI), 2));
  const result = [];
  // halo
  const haloSeen = new Set();
  for (let i = 0; i < haloNumber; i++) {
    const t = Math.random() * 2 * Math.PI;
    let p = heartFn(t, 11.6);
    p = shrink(p.x, p.y, haloRadius);
    const key = Math.round(p.x) + ',' + Math.round(p.y);
    if (!haloSeen.has(key)) {
      haloSeen.add(key);
      result.push({
        x: p.x + (Math.random() * 28 - 14),
        y: p.y + (Math.random() * 28 - 14),
        size: Math.random() < 0.5 ? 1 : 2
      });
    }
  }
  // outline
  for (const p of _points) {
    const np = calcPosition(p.x, p.y, ratio);
    result.push({ x: np.x, y: np.y, size: 1 + Math.floor(Math.random() * 3) });
  }
  // edge diffusion
  for (const p of _edgeDiffusionPoints) {
    const np = calcPosition(p.x, p.y, ratio);
    result.push({ x: np.x, y: np.y, size: 1 + Math.floor(Math.random() * 2) });
  }
  // center diffusion
  for (const p of _centerDiffusionPoints) {
    const np = calcPosition(p.x, p.y, ratio);
    result.push({ x: np.x, y: np.y, size: 1 + Math.floor(Math.random() * 2) });
  }
  allPoints[frame] = result;
}

// ---- init ----

build(2000);
for (let f = 0; f < GENERATE_FRAME; f++) calc(f);

// ---- canvas rendering ----

const canvas = document.getElementById('heartCanvas');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;
const ctx = canvas.getContext('2d');

const ORIGINAL_RATIO = CANVAS_WIDTH / CANVAS_HEIGHT;

function resizeCanvas() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  let w, h;
  if (winW / winH > ORIGINAL_RATIO) {
    h = winH;
    w = h * ORIGINAL_RATIO;
  } else {
    w = winW;
    h = w / ORIGINAL_RATIO;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let frame = 0;

function draw() {
  ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  const pts = allPoints[frame % GENERATE_FRAME];
  ctx.fillStyle = HEART_COLOR;
  for (const p of pts) {
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  // text
  ctx.fillStyle = HEART_COLOR;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontSize = Math.min(36, CANVAS_WIDTH * 0.056);
  ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  ctx.fillText('我的公主殿下', CANVAS_CENTER_X, CANVAS_CENTER_Y);
  frame++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
